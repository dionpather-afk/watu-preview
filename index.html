<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watu · Concept Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --brand:#0E7C66;--brand-d:#095646;--brand-l:#E3F4EF;
  --acc:#F2A541;--acc-l:#FDF1DE;--acc-d:#8A5308;
  --bg:#F5F6F4;--card:#FFFFFF;--line:#E4E6E1;--line2:#D2D5CE;
  --tx:#1D211F;--tx2:#5B625E;--tx3:#8C928E;
  --red:#D64545;--red-l:#FCEAEA;--blue:#2F6FD1;--blue-l:#E7F0FC;--purple:#6B4FD8;--purple-l:#EFEBFC;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
svg.i{width:20px;height:20px;stroke-width:1.8;flex:none;vertical-align:middle}
svg.i.sm{width:16px;height:16px}svg.i.lg{width:26px;height:26px}svg.i.xl{width:40px;height:40px;stroke-width:1.4}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:60px 1fr;height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;color:var(--brand);letter-spacing:-.5px}
.logo .mark{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:8px 14px;color:var(--tx3)}
.search input{border:none;background:none;outline:none;flex:1;color:var(--tx)}
.top .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--tx2)}
.ibtn:hover{background:var(--bg)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ws{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line)}
.ws b{font-size:13px}.ws small{display:block;font-size:11px;color:var(--tx3);line-height:1.1}
.side{background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 30px}
.side h6{margin:16px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;color:var(--tx2);font-weight:500;text-align:left}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.nav .pill{margin-left:auto}
.main{overflow-y:auto;padding:22px 26px 80px}
.page{max-width:1180px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;letter-spacing:-.4px}
.ph p{margin:2px 0 0;color:var(--tx2)}
.ph .sp{flex:1}
.bnav{display:none}

/* atoms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-weight:600;background:var(--card);border:1px solid var(--line2);white-space:nowrap}
.btn:hover{border-color:var(--tx3)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.p:hover{background:var(--brand-d)}
.btn.a{background:var(--acc);border-color:var(--acc);color:#3A2300}
.btn.g{border-color:transparent;background:none}.btn.g:hover{background:var(--bg)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.d{color:var(--red);border-color:#F1C7C7}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bg);color:var(--tx2);white-space:nowrap}
.pill.g{background:var(--brand-l);color:var(--brand-d)}.pill.a{background:var(--acc-l);color:var(--acc-d)}
.pill.r{background:var(--red-l);color:var(--red)}.pill.b{background:var(--blue-l);color:var(--blue)}.pill.v{background:var(--purple-l);color:var(--purple)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:14px;overflow:hidden}
.av.sm{width:30px;height:30px;font-size:12px}.av.lg{width:56px;height:56px;font-size:20px}
.av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--tx2)}.faint{color:var(--tx3)}.small{font-size:12px}.b{font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;font-weight:600;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);font-weight:500;font-size:13px;background:var(--card);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.inp{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--card);outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
label.lb{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
.stat{padding:16px}.stat .n{font-size:24px;font-weight:700;letter-spacing:-.5px}.stat .l{color:var(--tx2);font-size:13px}
.up{color:var(--brand);font-weight:600;font-size:12px}.dn{color:var(--red);font-weight:600;font-size:12px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;color:var(--tx3);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.t tr:hover td{background:#FAFBF9}
.sw{width:40px;height:23px;border-radius:12px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}.sw.on::after{left:19px}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);border-radius:4px}
.empty{padding:40px;text-align:center;color:var(--tx3)}
.sect{font-size:16px;font-weight:700;margin:24px 0 10px}
.hr{height:1px;background:var(--line);margin:14px 0}
.demo{background:var(--acc-l);color:var(--acc-d);font-size:12px;font-weight:600;text-align:center;padding:4px;position:fixed;bottom:0;left:0;right:0;z-index:50}

/* feed */
.feedwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.feedwrap>*,.studio>*,.drive>*,.inbox>*,.grid>*{min-width:0}
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.story{width:104px;height:170px;border-radius:12px;flex:none;position:relative;overflow:hidden;color:#fff;font-size:12px;font-weight:600}
.story img{width:100%;height:100%;object-fit:cover}
.story .av{position:absolute;top:8px;left:8px;border:3px solid var(--brand);width:34px;height:34px;font-size:12px}
.story span{position:absolute;bottom:8px;left:8px;right:8px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.story.add{background:var(--card);border:1px dashed var(--line2);color:var(--tx2);display:grid;place-items:center;text-align:center}
.compose-box{display:flex;gap:10px;align-items:center;padding:14px 16px;margin-bottom:14px}
.compose-box .fake{flex:1;background:var(--bg);border-radius:999px;padding:10px 16px;color:var(--tx3);text-align:left}
.post{margin-bottom:14px}
.post .hd{display:flex;gap:10px;padding:14px 16px 8px;align-items:flex-start}
.post .hd .n{font-weight:600}.post .hd .m{font-size:12px;color:var(--tx3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.post .bd{padding:0 16px 10px;white-space:pre-line}
.post .media{width:100%;display:block;max-height:420px;object-fit:cover;background:var(--bg)}
.post .ft{display:flex;border-top:1px solid var(--line);padding:4px 8px}
.post .ft button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:8px;color:var(--tx2);font-weight:500}
.post .ft button:hover{background:var(--bg)}
.post .ft button.on{color:var(--brand)}
.post .cnt{display:flex;justify-content:space-between;padding:0 16px 8px;font-size:12px;color:var(--tx3)}
.post .comments{padding:6px 16px 12px;border-top:1px solid var(--line)}
.cmt{display:flex;gap:8px;margin:8px 0}.cmt .bub{background:var(--bg);border-radius:12px;padding:6px 11px}
.prod-strip{display:flex;gap:10px;align-items:center;margin:0 16px 12px;padding:10px;border:1px solid var(--line);border-radius:10px}
.prod-strip img{width:56px;height:56px;border-radius:8px;object-fit:cover}

/* market */
.lst{overflow:hidden;cursor:pointer;transition:.15s}
.lst:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.lst img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg)}
.lst .c{padding:10px 12px}
.lst .pr{font-weight:700;font-size:16px}
.lst .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;font-size:12px;font-weight:600;color:var(--tx2);min-width:84px;border:1px solid transparent}
.cat .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center}
.cat.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,24,22,.5);display:grid;place-items:center;z-index:100;padding:20px;animation:fi .15s}
.mdl{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mdl.w{max-width:900px}.mdl.n{max-width:420px}
.mdl .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.mdl .mh h3{margin:0;font-size:17px;flex:1}
.mdl .mb{padding:18px 20px}
.mdl .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1D211F;color:#fff;padding:11px 18px;border-radius:10px;font-weight:500;z-index:200;display:flex;gap:8px;align-items:center;animation:fi .2s;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}

/* composer */
.opt{border:1px solid var(--line2);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:500;background:var(--card);text-align:left}
.opt.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.summary{background:var(--brand-l);color:var(--brand-d);border-radius:10px;padding:10px 12px;font-weight:600;font-size:13px}
.dest{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid var(--line)}
.dest.on{border-color:var(--brand);background:#F4FBF8}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none}
.cb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lock{font-size:12px;color:var(--tx3);display:flex;gap:4px;align-items:center}

/* inbox */
.inbox{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 170px);overflow:hidden}
.ilist{border-right:1px solid var(--line);overflow-y:auto}
.iitem{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.iitem:hover{background:#FAFBF9}.iitem.on{background:var(--brand-l)}
.iitem .tx{flex:1;min-width:0}.iitem .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-size:13px}
.thread{display:flex;flex-direction:column;min-width:0}
.thd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:16px;background:#FAFBF9;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand)}
.msg small{display:block;font-size:10px;opacity:.65;margin-top:2px;text-align:right}
.reply{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.reply textarea{flex:1;resize:none;height:42px}
.src{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:#fff;flex:none}
.src svg{width:12px;height:12px}

/* crm */
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kcol{background:#EEF0EC;border-radius:12px;padding:10px;min-height:300px}
.kcol h4{margin:4px 4px 10px;font-size:13px;display:flex;justify-content:space-between}
.deal{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid var(--line);cursor:grab}
.deal.drag{opacity:.4}
.kcol.over{background:var(--brand-l)}
.journey{display:flex;align-items:center;gap:0;overflow-x:auto;padding:10px 0}
.jstep{min-width:150px;padding:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);text-align:center;font-size:13px}
.jstep .ic{margin:0 auto 6px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.jarr{min-width:34px;text-align:center;color:var(--tx3)}

/* website builder */
.browser{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff}
.browser .bb{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#EEF0EC;border-bottom:1px solid var(--line2)}
.browser .bb i{width:10px;height:10px;border-radius:50%;background:#D2D5CE;display:inline-block}
.browser .url{flex:1;background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--tx2)}
.site-hero{position:relative;height:260px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:28px}
.site-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.site-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:1}
.site-hero *{position:relative;z-index:2}
.gen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-l);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.chk .ok{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--tx3)}
.chk .ok.y{background:var(--brand);color:#fff}

/* drive */
.drive{display:grid;grid-template-columns:220px 1fr;gap:16px}
.ftile{padding:12px;cursor:pointer;text-align:center}
.ftile:hover{border-color:var(--brand)}
.ftile .th{height:90px;border-radius:8px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden;background:var(--bg)}
.ftile .th img{width:100%;height:100%;object-fit:cover}
.ftile .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* studio */
.studio{display:grid;grid-template-columns:1fr 300px;gap:16px}
.canvas{background:repeating-conic-gradient(#EEF0EC 0 25%,#fff 0 50%) 0 0/20px 20px;border-radius:12px;display:grid;place-items:center;min-height:440px;overflow:hidden;position:relative}
.canvas img{max-width:100%;max-height:440px;transition:filter .2s}
.rng{width:100%;accent-color:var(--brand)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{background:#FAFBF9;padding:8px;font-size:12px;font-weight:600;color:var(--tx3);text-align:center}
.cal .d{background:var(--card);min-height:96px;padding:6px;font-size:12px;cursor:pointer}
.cal .d:hover{background:#FAFBF9}
.cal .d.o{color:var(--tx3);background:#FBFBFA}
.cal .d.today .num{background:var(--brand);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.ev{display:block;margin-top:3px;padding:2px 6px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* phone/sim */
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.call{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(10,14,12,.6)}
.phone{width:300px;height:560px;border-radius:40px;background:linear-gradient(160deg,#0E7C66,#05362C);color:#fff;padding:60px 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);border:8px solid #111}
.phone.spam{background:linear-gradient(160deg,#B23A3A,#3E0E0E)}
.phone .acts{margin-top:auto;display:flex;gap:40px}
.phone .acts button{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff}

/* shield */
.score{font-size:52px;font-weight:800;letter-spacing:-2px}

/* apps */
.app-t{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.app-t:hover{background:var(--card);box-shadow:var(--sh)}
.app-t .lg{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.ai-chat{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:#FAFBF9;border-radius:10px}

/* landing */
.land-hero{background:linear-gradient(135deg,#0E7C66,#064538);color:#fff;border-radius:20px;padding:44px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;overflow:hidden}
.land-hero h1{font-size:40px;line-height:1.1;margin:0 0 14px;letter-spacing:-1px}
.land-hero img{width:100%;border-radius:16px}
.plan{padding:22px;display:flex;flex-direction:column;gap:10px}
.plan.hot{border:2px solid var(--brand);position:relative}
.plan .pr{font-size:30px;font-weight:800}
.plan ul{padding:0;margin:0;list-style:none}.plan li{padding:4px 0;display:flex;gap:8px;align-items:flex-start;font-size:13px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr 62px}
  .side{display:none}
  .side.open{display:block;position:fixed;top:56px;left:0;bottom:0;width:260px;z-index:60;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .main{padding:14px 12px 90px}
  .bnav{display:flex;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;align-items:center;padding-bottom:20px}
  .bnav button{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:600;color:var(--tx3);gap:2px;padding:6px}
  .bnav button.on{color:var(--brand)}
  .search,.ws div,.hide-m{display:none}

function ic(n, c=''){ const b = (typeof ICONS!=='undefined' && ICONS[n]) || ICONS['circle']; return `<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`; }
function hash(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h); }
function R(n){ const neg=n<0; n=Math.abs(n); const s=(Math.round(n*100)/100).toFixed(n%1?2:0).replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (neg?'-':'')+'R'+s; }
function K(n){ return n>=1000? (n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k' : ''+n; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(n){ return n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?'; }
function av(n, c='', imgKey){ if(imgKey) return `<div class="av ${c}"><img src="${img(imgKey)}" alt=""></div>`; return `<div class="av ${c}" style="background:${COLORS[hash(n)%COLORS.length]}">${initials(n)}</div>`; }

  jersey:['shirt-sport','#FACC15','#15803D'], market:['building-store','#F97316','#9A3412'], car:['car','#475569','#0F172A'], solar:['solar-panel','#FBBF24','#1E3A8A'],
  flyer:['photo','#8B5CF6','#4C1D95'], ai:['sparkles','#8B5CF6','#0E7C66'] };
const _imgCache = {};
function img(k){
  if(!k) return '';
  if(_imgCache[k]) return _imgCache[k];
  if(typeof IMGS!=='undefined' && IMGS[k]) return _imgCache[k]=IMGS[k];
  const key = k.replace('ill:',''); const [icn,c1,c2] = ILL[key] || ['photo','#94A3B8','#334155'];
  const body = (ICONS[icn]||ICONS['photo']);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><circle cx="330" cy="40" r="90" fill="#fff" opacity=".08"/><circle cx="60" cy="270" r="70" fill="#fff" opacity=".07"/><g transform="translate(140 90) scale(5)" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".95">${body}</g></svg>`;
  return _imgCache[k] = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function toast(msg, icon='circle-check'){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=ic(icon)+`<span>${msg}</span>`; document.body.appendChild(t); setTimeout(()=>t.remove(), 2800); }
function modal(html, cls=''){ closeModal(); const o=document.createElement('div'); o.className='ov'; o.id='ov'; o.innerHTML=`<div class="mdl ${cls}" onclick="event.stopPropagation()">${html}</div>`; o.onclick=closeModal; document.body.appendChild(o); }
function closeModal(){ const o=$('#ov'); if(o) o.remove(); }

function bars(data, key, color='var(--brand)', fmt=K){
  const mx=Math.max(...data.map(d=>d[key]));
  return `<div class="col" style="gap:8px">${data.map(d=>`<div><div class="row" style="justify-content:space-between;font-size:13px"><span>${d.p||d.l}</span><b>${fmt(d[key])}</b></div><div class="bar"><i style="width:${(d[key]/mx*100).toFixed(0)}%;background:${color}"></i></div></div>`).join('')}</div>`;
}
function spark(vals, color='#0E7C66', h=60){
  const w=300, mx=Math.max(...vals), mn=Math.min(...vals), pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-mn)/(mx-mn||1))*(h-8)-4).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/><polygon points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".08"/></svg>`;
}

const PRIVATE = ['Friends only','Close friends','Custom','Only me'];

const TYPE_DEFAULT = { 'Post':['Feed','Profile / Workspace'], 'Product':['Feed','Marketplace','Profile / Workspace'], 'Auction':['Auctions hub','Feed','Status (24 h)'], 'Event':['Events','Feed'], 'Affiliate':['Affiliate hub','Feed'], 'Evergreen Ad':['Feed','Facebook Page','Instagram','WhatsApp → VIP list'], 'Status':['Status (24 h)'] };
const TYPE_LOCK = { 'Auction':'Auctions hub', 'Event':'Events', 'Affiliate':'Affiliate hub', 'Status':'Status (24 h)', 'Product':'Marketplace' };
function openComposer(type='Post', preset={}){
  Object.assign(C,{type, aud: type==='Auction'?'Public':'Public', dest:new Set(TYPE_DEFAULT[type]||['Feed']), when:type==='Evergreen Ad'?'evergreen':'now', freq:'Every Friday 08:00', text:preset.text||'', img:preset.img||(type==='Product'||type==='Evergreen Ad'?'brakepads':''), price:'890', verifiedOnly:true, personal:false});
  drawComposer();
}
function drawComposer(){
  const priv = PRIVATE.includes(C.aud);
  if(priv) DESTS[2][1].forEach(d=>C.dest.delete(d[0]));
  if(TYPE_LOCK[C.type]) C.dest.add(TYPE_LOCK[C.type]);
  const ext=[...C.dest].filter(d=>DESTS[2][1].some(x=>x[0]===d)).length;
  const when = C.when==='now'?'Now':C.when==='later'?'Tomorrow 08:00':`Repeats ${C.freq}`;
  const summary = `${C.type} · ${C.aud}${C.type==='Auction'&&C.verifiedOnly?' · Verified buyers':''} · ${[...C.dest].slice(0,4).join(', ')}${C.dest.size>4?` +${C.dest.size-4}`:''} · ${when}`;
  modal(mh('Create · write once, publish everywhere','pencil')+`<div class="mb">
    <label class="lb" style="margin-top:0">1. What are you posting?</label>
    <div class="chips">${Object.keys(TYPE_DEFAULT).map(t=>`<button class="chip ${C.type===t?'on':''}" onclick="C.type='${t}';C.dest=new Set(TYPE_DEFAULT['${t}']);if('${t}'==='Evergreen Ad')C.when='evergreen';if('${t}'==='Affiliate'&&C.aud==='Only me')C.aud='Public';drawComposer()">${t}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px;align-items:flex-start"><textarea class="inp" id="ctext" rows="4" placeholder="Hi {first name}, ..." oninput="C.text=this.value">${esc(C.text)}</textarea></div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <button class="btn sm" onclick="aiWrite()">${ic('sparkles','sm')} AI write</button>
      <button class="btn sm" onclick="pickImg()">${ic('photo','sm')} ${C.img?'Change photo':'Add photo'}</button>
      <button class="btn sm" onclick="C.text=(document.getElementById('ctext').value);C.text='Hi {first name}, '+C.text;drawComposer()">${ic('user','sm')} Personalise</button>
      ${C.img?`<img src="${img(C.img)}" style="width:42px;height:42px;border-radius:8px;object-fit:cover">`:''}
      ${C.type==='Product'||C.type==='Auction'?`<div class="row small"><span class="faint">${C.type==='Auction'?'Start bid':'Price'} R</span><input class="inp" style="width:100px" value="${C.price}" oninput="C.price=this.value"></div>`:''}
    </div>
    ${C.type==='Auction'?`<div class="row small" style="margin-top:10px">${sw(C.verifiedOnly,"C.verifiedOnly=!C.verifiedOnly;drawComposer()")} Verified buyers only (cuts fake bids) · reserve price · R500 bidder deposit · anti-sniping +2 min</div>`:''}
    <label class="lb">2. Who can see it?</label>
    <div class="grid g3" style="gap:8px">${AUDS.map(([a,i,d])=>{const dis=C.type==='Affiliate'&&a==='Only me';return `<button class="opt ${C.aud===a?'on':''}" ${dis?'disabled style="opacity:.4"':''} onclick="C.aud='${a}';drawComposer()">${ic(i,'sm')}<div><div style="font-size:13px">${a}</div>${d?`<div class="faint" style="font-size:11px">${d}</div>`:''}</div></button>`}).join('')}</div>
    ${C.type==='Affiliate'?'<div class="lock" style="margin-top:6px">'+ic('info-circle','sm')+' Affiliate posts exist to be shared, so "Only me" is off. Label "#Ad / Affiliate" is added automatically.</div>':''}
    <label class="lb">3. Where does it go?</label>
    ${DESTS.map(([g,list])=>`<div class="faint small b" style="margin:10px 0 6px">${g}${g==='Connected accounts'&&priv?' · switched off for private audiences so nothing leaks':''}</div><div class="grid g2" style="gap:6px">${list.map(([d,i,ext])=>{const lock=TYPE_LOCK[C.type]===d, dis=ext&&priv, on=C.dest.has(d);return `<button class="dest ${on?'on':''}" ${dis?'disabled style="opacity:.4"':''} onclick="${lock?"toast('Main placement is locked for this post type','lock')":`C.dest.has('${d}')?C.dest.delete('${d}'):C.dest.add('${d}');drawComposer()`}"><span class="cb ${on?'on':''}">${on?ic('check','sm'):''}</span>${ic(i,'sm')}<span style="flex:1;text-align:left;font-size:13px">${d}</span>${lock?ic('lock','sm'):''}</button>`}).join('')}</div>`).join('')}
    <label class="lb">4. When?</label>
    <div class="chips">${[['now','Post now'],['later','Schedule'],['evergreen','Evergreen (repeat automatically)']].map(([k,n])=>`<button class="chip ${C.when===k?'on':''}" onclick="C.when='${k}';drawComposer()">${n}</button>`).join('')}</div>
    ${C.when==='evergreen'?`<select class="inp" style="margin-top:8px" onchange="C.freq=this.value">${['Every Friday 08:00','Every Monday & Thursday 07:30','Every day 12:00','1st of every month'].map(f=>`<option ${C.freq===f?'selected':''}>${f}</option>`).join('')}</select>`:''}

    <div class="summary" style="margin-top:14px">${ic('checks','sm')} ${summary}</div>
  </div>
  <div class="mf"><button class="btn" onclick="closeModal();toast('Saved as draft','device-floppy')">Save draft</button><button class="btn p" onclick="publish()">${ic('send','sm')} ${C.when==='now'?'Publish':C.when==='later'?'Schedule':'Start Evergreen Ad'} to ${C.dest.size} place${C.dest.size>1?'s':''}</button></div>`,'w');
}

AFTER.auctions = () => {
  clearInterval(auctionTimer); clearInterval(botTimer);

  tick(); auctionTimer=setInterval(tick,1000);
  botTimer=setInterval(()=>{ const a=AUCTIONS[Math.floor(Math.random()*AUCTIONS.length)]; if(a.end<Date.now()) return; a.bid+=a.inc; a.bids++; const wasMine=a.mine; a.mine=false; if(a.auto && a.bid+a.inc<=a.autoMax){ a.bid+=a.inc; a.bids++; a.mine=true; toast(`Auto-bid placed on ${a.t.slice(0,24)}… (${R(a.bid)})`,'robot'); } else if(wasMine) toast(`You were outbid on ${a.t.slice(0,26)}…`,'alert-circle'); render(); }, 12000);

VIEWS.inbox = () => {
  const list=INBOX.filter(m=>S.ifilter==='all'||m.src===S.ifilter);
  const t=INBOX.find(m=>m.id===S.thread)||list[0];
  return ph('Unified inbox','WhatsApp, Messenger, Instagram, email, SMS, marketplace and reviews in one stream',`<button class="btn" onclick="toast('Canned replies: 12 saved')">${ic('template','sm')} Saved replies</button>`)+`
  <div class="chips" style="margin-bottom:12px"><button class="chip ${S.ifilter==='all'?'on':''}" onclick="S.ifilter='all';render()">All</button>${Object.entries(SRC).map(([k,s])=>`<button class="chip ${S.ifilter===k?'on':''}" onclick="S.ifilter='${k}';render()"><span class="src" style="background:${s.c};width:14px;height:14px"></span>${s.n}</button>`).join('')}</div>
  <div class="card inbox">
    <div class="ilist">${list.map(m=>`<div class="iitem ${t&&m.id===t.id?'on':''}" onclick="S.thread=${m.id};INBOX.find(x=>x.id===${m.id}).unread=0;render()">${av(m.who)}<div class="tx"><div class="row" style="justify-content:space-between"><b class="small">${m.who}</b><span class="faint small">${m.time}</span></div><div class="row" style="gap:6px">${src(m.src)}<span class="pv">${esc(m.msgs[m.msgs.length-1].t)}</span>${m.unread?`<span class="pill r">${m.unread}</span>`:''}</div>${m.assign?`<div class="small faint">→ ${m.assign}</div>`:''}</div></div>`).join('')||'<div class="empty">No messages</div>'}</div>
    ${t?`<div class="thread"><div class="thd">${av(t.who,'sm')}<div style="flex:1"><b>${t.who}</b><div class="small faint row" style="gap:4px">${src(t.src)} via ${SRC[t.src].n} · in CRM ${ic('check','sm')}</div></div>
      <select class="inp" style="width:auto" onchange="INBOX.find(x=>x.id===${t.id}).assign=this.value;toast('Assigned to '+this.value);render()"><option value="">Assign to…</option>${['Thabo','Lerato','Sipho'].map(n=>`<option ${t.assign===n?'selected':''}>${n}</option>`).join('')}</select>
      <button class="btn sm" onclick="toast('Deal created in CRM pipeline','address-book')">${ic('plus','sm')} Deal</button></div>
      <div class="msgs" id="msgs">${t.msgs.map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.t)}<small>${m.at}${m.me?' ✓✓':''}</small></div>`).join('')}</div>
      <div class="reply"><button class="ibtn" onclick="toast('Attach from Watu Drive')">${ic('paperclip')}</button><textarea class="inp" id="rtext" placeholder="Reply via ${SRC[t.src].n}…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendReply(${t.id})}"></textarea><button class="btn" onclick="$('#rtext').value=AI_REPLIES[${t.id}]||AI_REPLIES.def;toast('AI draft ready, check before sending','sparkles')">${ic('sparkles','sm')} AI draft</button><button class="btn p" onclick="sendReply(${t.id})">${ic('send','sm')}</button></div>
    </div>`:'<div class="empty">Select a conversation</div>'}
  </div>`;
};
AFTER.inbox = () => { const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight; };
function sendReply(id){
  const v=$('#rtext').value.trim(); if(!v) return;
  const t=INBOX.find(x=>x.id===id); const now=new Date().toTimeString().slice(0,5);
  t.msgs.push({me:1,t:v,at:now}); t.time=now; render();
  setTimeout(()=>{ const R2={1:'Perfect, 11:00 please 👍',2:'Great, I\'ll come at lunch.',4:'Shot, thanks!',6:'Deal 🤝'}; if(R2[id]){ t.msgs.push({me:0,t:R2[id],at:new Date().toTimeString().slice(0,5)}); if(S.route==='inbox'&&S.thread===id) render(); toast(`${t.who} replied`,'message-circle'); } }, 2200);
}

const JOURNEY=[['user-plus','New group member','Trigger'],['message-circle','Welcome message','Watu chat'],['clock','Wait 3 days',''],['book','Send catalogue','WhatsApp list'],['git-branch','No purchase?','Condition'],['discount-2','10% coupon','SMS + email']];
function moveDeal(id){ const order=Object.keys(DEALS); for(const [i,st] of order.entries()){ const k=DEALS[st].findIndex(d=>d.id===id); if(k>-1){ const [d]=DEALS[st].splice(k,1); DEALS[order[i+1]].push(d); toast(`${d.n} moved to ${order[i+1]}`); if(order[i+1]==='Won') toast(`🎉 Won ${R(d.v)} · invoice created`,'trophy'); break; } } render(); }
function dropDeal(e,to){ e.preventDefault(); const id=e.dataTransfer.getData('t'); for(const st in DEALS){ const k=DEALS[st].findIndex(d=>d.id===id); if(k>-1){ const [d]=DEALS[st].splice(k,1); DEALS[to].push(d); toast(`${d.n} → ${to}`); } } render(); }
function newDeal(){ modal(mh('New deal','plus')+`<div class="mb"><label class="lb" style="margin-top:0">Contact</label><select class="inp" id="dn">${CONTACTS.map(c=>`<option>${c.n}</option>`).join('')}</select><label class="lb">What</label><input class="inp" id="dt" value="Full service"><label class="lb">Value (R)</label><input class="inp" id="dv" value="2500"></div><div class="mf"><button class="btn p" onclick="DEALS.Lead.push({id:'D'+Date.now(),n:$('#dn').value,t:$('#dt').value,v:+$('#dv').value,tag:'Manual'});closeModal();S.crmTab='Pipeline';go('crm');toast('Deal added')">Add to pipeline</button></div>`,'n'); }
function contactTimeline(n){ const c=CONTACTS.find(x=>x.n===n); modal(mh(n,'user')+`<div class="mb"><div class="row">${av(n,'lg')}<div><div class="b">${n}</div><div class="faint small">${c.ph} · ${c.area} · lifetime ${R(c.spend)}</div><div style="margin-top:4px">${c.tags.map(t=>`<span class="pill">${t}</span>`).join(' ')}</div></div></div><div class="sect">Timeline</div>${[['brand-whatsapp','WhatsApp: asked about brake pads','Today 09:12'],['shopping-cart','Bought battery 652 · R1 350','12 Oct'],['gavel','Bid on Snap-on toolbox','02 Oct'],['users','Joined Buy & Sell Benoni','18 Sep'],['note','Note: prefers morning bookings','18 Sep']].map(([i,t,d])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">${ic(i,'sm')}<span style="flex:1">${t}</span><span class="faint small">${d}</span></div>`).join('')}</div><div class="mf"><button class="btn" onclick="toast('Reminder set: call ${n} in 3 months','bell')">${ic('bell','sm')} Remind me</button><button class="btn p" onclick="closeModal();go('inbox')">Message</button></div>`); }

function connectAcc(k){ const a=ACCOUNTS.find(x=>x.k===k); if(a.on){ a.on=false; a.f='Not connected'; render(); return toast(a.n+' disconnected'); }

      <div class="row" style="margin-top:18px;flex-wrap:wrap">${[['send','Send',"sendMoney()"],['qrcode','Receive',"toast('Your QR code is ready to scan','qrcode')"],['building-store','Pay a seller',"go('market')"],['cash','Cash-out',"toast('Cash-out voucher: collect at any partner store','cash')"]].map(([i,n,f])=>`<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)" onclick="${f}">${ic(i,'sm')} ${n}</button>`).join('')}</div></div>
    <div class="card pad"><div class="row" style="justify-content:space-between"><b>${ic('users-group','sm')} Kgosi Family Stokvel</b><span class="pill g">On track</span></div><div class="small faint">12 members · R1 000 / month · payout rotation</div><div class="bar" style="margin:12px 0 6px"><i style="width:75%"></i></div><div class="small">R108 000 saved of R144 000 goal (December payout)</div>
      <div class="row" style="margin-top:10px;gap:4px">${['Sipho','Nomsa','Thabo','Zanele','Bongani','Mbali'].map((n,i)=>`<div title="${n}" style="position:relative">${av(n,'sm')}${i<5?`<span style="position:absolute;bottom:-3px;right:-3px;background:var(--brand);color:#fff;border-radius:50%;width:14px;height:14px;display:grid;place-items:center">${ic('check','sm')}</span>`:''}</div>`).join('')}<span class="small faint">+6</span></div>
      <button class="btn sm p" style="margin-top:12px" onclick="S.bal-=1000;render();toast('R1 000 contributed · all members can see it','users-group')">Contribute R1 000</button></div>
  </div>
  <div class="sect">Transactions</div>
  <div class="card">${TX.map(t=>`<div class="row" style="padding:11px 14px;border-bottom:1px solid var(--line)"><div class="av sm" style="background:var(--bg);color:var(--tx2)">${ic(t.i,'sm')}</div><div style="flex:1"><div>${t.t}</div><div class="small faint">${t.d}</div></div><b class="${t.a<0?'dn':'up'}" style="font-size:14px">${t.a>0?'+':''}${R(t.a)}</b></div>`).join('')}</div>
  <p class="small faint">The real Wallet and escrow would run through a licensed bank or payment partner.</p>`;
function sendMoney(){ modal(mh('Send money','send')+`<div class="mb"><label class="lb" style="margin-top:0">To</label><select class="inp" id="smto">${CONTACTS.map(c=>`<option>${c.n}</option>`).join('')}</select><label class="lb">Amount (R)</label><input class="inp" id="sma" value="250"><label class="lb">Reference</label><input class="inp" value="Thanks!"></div><div class="mf"><button class="btn p" onclick="const a=+$('#sma').value;S.bal-=a;TX.unshift({d:'Just now',t:'Sent to '+$('#smto').value,a:-a,i:'send'});closeModal();render();toast('Sent '+R(a)+' instantly · free between Watu users','send')">Send now</button></div>`,'n'); }

/* ---------- Watu SIM ---------- */
S.used=12.4; S.simLock=true;
VIEWS.mobile = () => { const pct=S.used/20; const C2=2*Math.PI*70;
  return ph('Watu SIM','Your plan includes a SIM or eSIM with data, minutes and SMS · runs on a host network (MVNO)',`<button class="btn" onclick="esim()">${ic('qrcode','sm')} Add eSIM</button>`)+`

    <div class="card pad"><b>This month</b>${[['Voice minutes','312 of 500','phone',62],['SMS','41 of 200','message-2',20],['Business line','011 *** 4400','building',100],['Rollover from October','2.3 GB','arrow-forward',100]].map(([n,v,i,p])=>`<div style="margin-top:12px"><div class="row" style="justify-content:space-between">${ic(i,'sm')}<span style="flex:1">${n}</span><b class="small">${v}</b></div><div class="bar" style="margin-top:4px"><i style="width:${p}%"></i></div></div>`).join('')}</div>
    <div class="card pad"><b>Team data pool</b>${[['Sipho (you)',6.2],['Thabo',3.9],['Lerato',2.3]].map(([n,g])=>`<div class="row" style="padding:7px 0">${av(n,'sm')}<span style="flex:1">${n}</span><b class="small">${g} GB</b></div>`).join('')}<button class="btn sm" onclick="toast('Shared 1 GB with Thabo','share')">${ic('share','sm')} Share data</button>
      <div class="hr"></div><div class="row" style="justify-content:space-between"><div><b class="small">SIM swap lock</b><div class="small faint">Swaps need in-app approval + ID</div></div>${sw(S.simLock,"S.simLock=!S.simLock;render();toast(S.simLock?'SIM swap lock ON':'SIM swap lock OFF · not recommended','shield-lock')")}</div></div>
  </div>
  <div class="sect">Top up in the app</div>
  <div class="grid g4">${[['1 GB','R29'],['5 GB','R99'],['10 GB','R169'],['100 min','R49']].map(([n,p])=>`<div class="card pad" style="text-align:center"><div style="font-size:22px;font-weight:800">${n}</div><div class="faint">${p} · 30 days</div><button class="btn sm p" style="margin-top:10px" onclick="S.bal-=${p.slice(1)};${n.includes('GB')?`S.used=Math.max(0,S.used-${parseInt(n)});`:''}render();toast('${n} added · paid from Watu Wallet','antenna-bars-5')">Buy</button></div>`).join('')}</div>
  <p class="small faint">Legal: RICA registration on activation; ICASA licences via the host network / MVNE partner. Prices are suggestions to be confirmed once wholesale data costs are known.</p>`; };
function esim(){ modal(mh('Add an eSIM','qrcode')+`<div class="mb" style="text-align:center"><svg viewBox="0 0 29 29" width="180" height="180" style="image-rendering:pixelated">${Array.from({length:29*29},(_,i)=>{const x=i%29,y=Math.floor(i/29);const f=(x<7&&y<7)||(x>21&&y<7)||(x<7&&y>21);const on=f?((x%28<7&&y%28<7)?(x==0||y==0||x==6||y==6||(x>1&&x<5&&y>1&&y<5)):(x==22||x==28||y==0||y==6||y==22||y==28||(x>23&&x<27&&y>1&&y<5)||(x>1&&x<5&&y>23&&y<27)||x==0||x==6)):(hash(x+','+y)%3==0);return on?`<rect x="${x}" y="${y}" width="1" height="1"/>`:''}).join('')}</svg><p class="small faint">Demo QR only. Scan with your phone camera → Add eSIM. RICA check happens in the app.</p></div>`,'n'); }

/* ---------- Watu Shield ---------- */
S.score=82; S.fixes=[['Turn on 2FA for 2 team members',6],['Add DMARC to kgosiauto.co.za',5],['Remove 1 old device (Samsung A10)',3]];

  <div class="grid" style="grid-template-columns:1fr 2fr">
    <div class="card pad" style="text-align:center"><div class="small faint">Security score</div><div class="score" style="color:${S.score>=95?'var(--brand)':'var(--acc-d)'}">${S.score}<span style="font-size:22px" class="faint">/100</span></div><div class="bar"><i style="width:${S.score}%;background:${S.score>=95?'var(--brand)':'var(--acc)'}"></i></div>
      <div style="text-align:left;margin-top:14px">${S.fixes.map((f,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="flex:1" class="small">${f[0]}</span><button class="btn sm p" onclick="S.score+=S.fixes[${i}][1];S.fixes.splice(${i},1);render();toast('Fixed · score up','shield-check')">Fix</button></div>`).join('')||`<div class="small up">${ic('circle-check','sm')} All fixes done. Nice!</div>`}</div></div>
    <div class="col">
      <div class="card pad"><b>Recent threats blocked</b>${[['link-off','Phishing link in WhatsApp: "fnb-verify-account.co" (blocked)','12 min','r'],['credit-card-off','Fake payment notification in Marketplace chat','2 h','r'],['phone-off','Robocall from spoofed number','Yesterday','a'],['mail-x','14 spam emails filtered · SPF/DKIM/DMARC active','Yesterday','g']].map(([i,t,w,c])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="pill ${c}">${ic(i,'sm')}</span><span style="flex:1" class="small">${t}</span><span class="small faint">${w}</span></div>`).join('')}</div>
      <div class="card pad" id="newlogin" style="border-color:#F4D9A8;background:var(--acc-l)"><b>${ic('device-laptop','sm')} New sign-in: Chrome on Windows · Pretoria</b><div class="small" style="margin:4px 0 10px">Was this you? High-risk actions are paused until you confirm.</div><button class="btn sm p" onclick="$('#newlogin').remove();toast('Thanks, device trusted')">Yes, it was me</button> <button class="btn sm d" onclick="$('#newlogin').remove();toast('Device logged out & password reset started','lock')">No, lock it</button></div>
      <div class="grid g2"><div class="card pad"><b>Devices</b>${[['device-mobile','Galaxy S24 · this phone'],['device-laptop','MacBook · Benoni'],['device-mobile','Samsung A10 · 4 months ago']].map(([i,n])=>`<div class="row small" style="padding:6px 0">${ic(i,'sm')}<span style="flex:1">${n}</span></div>`).join('')}</div>
      <div class="card pad"><b>POPIA toolkit</b>${['Consent records','Data subject requests (0 open)','Breach notification workflow','Information Officer: Sipho Dlamini'].map(t=>`<div class="row small" style="padding:6px 0">${ic('check','sm')}${t}</div>`).join('')}</div></div>

S.chat=[{me:0,t:'Hi Sipho 👋 I\'m Watu AI. I know your products, prices and contacts (with your permission). What shall I create?'}];
VIEWS.apps = () => ph('Apps & AI hub','Your favourite apps and AI in one place · one sign-in, one search')+`
  <div class="grid" style="grid-template-columns:1.3fr 1fr">
    <div>${APPS.map(g=>`<div class="sect" style="margin-top:6px">${g.g}</div><div class="grid g4" style="gap:6px">${g.a.map(a=>`<div class="app-t" onclick="toast('Opening ${a.n} through its official sign-in (simulated)','external-link')"><div class="lg" style="background:${a.c}">${a.n[0]}</div>${a.n}</div>`).join('')}</div>`).join('')}</div>
    <div class="card pad col"><div class="row"><b style="flex:1">${ic('sparkles','sm')} Watu AI assistant</b><select class="inp" style="width:auto"><option>Watu AI</option><option>ChatGPT (connected)</option><option>Claude (connected)</option><option>Gemini</option></select></div>
      <div class="ai-chat" id="aichat">${S.chat.map(m=>`<div class="msg ${m.me?'me':''}">${m.t}</div>`).join('')}</div>
      <div class="chips">${['Write a quote for a full service','Make a winter specials flyer','Reply to my latest review','Video script for a TikTok'].map(t=>`<button class="chip" onclick="aiAsk('${t}')">${t}</button>`).join('')}</div>
      <div class="row"><input class="inp" id="aiin" placeholder="Ask Watu AI…" onkeydown="if(event.key==='Enter')aiAsk(this.value)"><button class="btn p" onclick="aiAsk($('#aiin').value)">${ic('send','sm')}</button></div>
      <div class="small faint">Credits this month: <b id="cred">${S.cred||862}</b> of 1 000 · saves to Watu Drive with a "Made with AI" label</div></div>
  </div>`;
AFTER.apps = () => { const c=$('#aichat'); if(c) c.scrollTop=c.scrollHeight; };
function aiAsk(q){ if(!q||!q.trim()) return; S.chat.push({me:1,t:esc(q)}); S.cred=(S.cred||862)-4; render();
  const l=q.toLowerCase(); let a, file;
  if(l.includes('quote')){ a='Done ✅ <b>Quote Q-1182 · Full service (Polo Vivo 2016)</b><br>Labour R950 · Oil & filters R780 · Spark plugs R420 · <b>Total R2 150 incl. VAT</b>. Saved to Drive/Quotes. Send it to Priya on email or WhatsApp?'; file='Quote Q-1182 Full service.pdf'; }
  else if(l.includes('flyer')){ a='Here\'s your winter specials flyer, made with your brand kit. Saved to Drive/Made with AI.<br><img src="'+img('ill:flyer')+'" style="width:100%;border-radius:8px;margin-top:6px">'; file='Winter specials flyer v2.png'; }
  else if(l.includes('review')) a='Suggested reply to Lerato (5★): "Thank you so much Lerato! Thabo will be chuffed. See you at your next service 🔧" Want me to post it?';
  else if(l.includes('tiktok')||l.includes('video')) a='🎬 <b>15-sec TikTok script</b><br>0-3s: "Squeaky brakes on your Hilux?" (close-up)<br>3-10s: Thabo fits new pads, timelapse<br>10-15s: "R890, fitted same day in Benoni. Book on Watu." Open in Studio?';
  else a='Here\'s a first draft: "Hi {first name}, this week at Kgosi Auto we have free battery tests and same-day brake fitting." Want it as a post, email or WhatsApp broadcast?';
  setTimeout(()=>{ S.chat.push({me:0,t:a}); if(file) FILES.splice(4,0,{n:file,t:file.endsWith('png')?'img':'pdf',img:file.endsWith('png')?'ill:flyer':null,s:'180 KB',d:'Just now',ai:true,tags:['ai']}); if(S.route==='apps') render(); },900); }
</script>
